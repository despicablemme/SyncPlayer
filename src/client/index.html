<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SyncPlay - 同步视频播放器</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="header">
    <label for="roomIdInput">房间号:</label>
    <input type="text" id="roomIdInput" placeholder="输入房间号加入">
    <button id="joinBtn" class="btn btn-secondary">加入房间</button>
    <button id="createBtn" class="btn btn-primary">创建房间</button>
    <div class="controls">
      <div class="file-input-wrapper">
        <input type="file" id="videoInput" accept="video/mp4,video/webm,video/ogg,video/quicktime,video/x-matroska,video/x-msvideo,video/3gpp,video/*">
        <button class="btn btn-secondary">选择本地视频</button>
      </div>
      <span style="color: #555;">或</span>
      <input type="text" id="videoUrlInput" placeholder="输入视频URL" style="width: 250px;">
      <button id="loadUrlBtn" class="btn btn-secondary">加载URL</button>
      <label id="fileName" style="color: #888; font-size: 13px;"></label>
    </div>
  </div>

  <div class="video-container">
    <div id="noVideo" class="no-video">
      <p>请先选择一个视频文件或输入 URL</p>
      <p style="font-size: 12px; color: #555;">视频仅在本地使用，不会上传</p>
    </div>
    <video id="video" style="display: none;" controls preload="metadata"></video>
  </div>

  <div class="footer">
    <div class="status-item">
      <div id="localStatusDot" class="status-dot"></div>
      <span>本地: <span id="localStatus">就绪</span></span>
    </div>
    <div id="roomInfo" class="room-info" style="display: none;">
      <span id="roomLabel">我的房间号:</span>
      <span id="myRoomId" class="room-id"></span>
      <button id="copyBtn" class="copy-btn">复制</button>
    </div>
    <div class="stats" id="stats">延迟: —  |  漂移: 0.00s</div>
    <div class="status-item">
      <div id="remoteStatusDot" class="status-dot"></div>
      <span>对方: <span id="remoteStatus">未连接</span></span>
    </div>
  </div>

  <script src="../shared/sync-engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
