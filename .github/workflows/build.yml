name: Build Desktop Apps

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.5.0)'
        required: false
        type: string

  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'desktop/**'
      - 'src/**'
      - 'package.json'
      - '.github/workflows/**'

jobs:
  build-windows:
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.version != ''
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'desktop/package-lock.json'

      - name: Install
        run: cd desktop && npm ci

      - name: Prebuild
        run: cd desktop && npm run prebuild

      - name: Build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: cd desktop && npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: SyncPlay-Windows-Setup
          path: desktop/dist/*.exe
          retention-days: 30

  build-mac:
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.version != ''
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'desktop/package-lock.json'

      - name: Install
        run: cd desktop && npm ci

      - name: Prebuild
        run: cd desktop && npm run prebuild

      - name: Build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: cd desktop && npm run dist:mac

      - uses: actions/upload-artifact@v4
        with:
          name: SyncPlay-Mac-dmg
          path: desktop/dist/*.dmg
          retention-days: 30

  build-linux:
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'desktop/package-lock.json'

      - name: Install
        run: cd desktop && npm ci

      - name: Prebuild
        run: cd desktop && npm run prebuild

      - name: Build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: cd desktop && npm run dist:linux

      - uses: actions/upload-artifact@v4
        with:
          name: SyncPlay-Linux-AppImage
          path: desktop/dist/*.AppImage
          retention-days: 30

  verify:
    if: github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'docs:')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'desktop/package-lock.json'

      - name: Install
        run: cd desktop && npm ci

      - name: Prebuild
        run: cd desktop && npm run prebuild

      - name: Build all
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: |
          cd desktop
          npm run dist:mac || echo "mac failed"
          npm run dist:win || echo "win failed"
          npm run dist:linux || echo "linux failed"

      - name: Verify output
        run: ls -la desktop/dist/
