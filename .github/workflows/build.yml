name: Build Desktop Apps

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.5.0)'
        required: false
        type: string
      build_type:
        description: 'Build type (debug | release)'
        required: false
        type: choice
        default: 'release'
        options:
          - debug
          - release

  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'desktop/**'
      - 'src/**'
      - 'package.json'
      - '.github/workflows/**'

jobs:
  build-windows:
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.version != ''
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'desktop/package-lock.json'

      - name: Install
        run: cd desktop && npm ci

      - name: Prebuild
        run: cd desktop && npm run prebuild

      - name: Build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: cd desktop && npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: SyncPlay-Windows-Setup
          path: desktop/dist/*.exe
          retention-days: 30

  build-mac:
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.version != ''
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'desktop/package-lock.json'

      - name: Install
        run: cd desktop && npm ci

      - name: Prebuild
        run: cd desktop && npm run prebuild

      - name: Build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: cd desktop && npm run dist:mac

      - uses: actions/upload-artifact@v4
        with:
          name: SyncPlay-Mac-dmg
          path: desktop/dist/*.dmg
          retention-days: 30

  build-linux:
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'desktop/package-lock.json'

      - name: Install
        run: cd desktop && npm ci

      - name: Prebuild
        run: cd desktop && npm run prebuild

      - name: Build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: cd desktop && npm run dist:linux

      - uses: actions/upload-artifact@v4
        with:
          name: SyncPlay-Linux-AppImage
          path: desktop/dist/*.AppImage
          retention-days: 30

  # v0.6.2: Mac arm64 debug build 入口 (主人实测用, 不触发 release)
  # 跟 release job (build-windows / build-mac / build-linux) 互不影响
  build-mac-debug:
    if: github.event.inputs.build_type == 'debug' && startsWith(github.ref, 'refs/heads/main')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'desktop/package-lock.json'

      - name: Install
        run: cd desktop && npm ci

      - name: Prebuild
        run: cd desktop && npm run prebuild

      - name: Build Mac (debug, no sign)
        env:
          DEBUG: 'electron-builder'
          # 不传 CSC_LINK / CSC_KEY_PASSWORD → ad-hoc 签名 (同 v0.5.1)
        run: cd desktop && npx electron-builder --mac --arm64 --config.mac.identity=null

      - name: Upload debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: syncplay-mac-arm64-debug
          path: desktop/dist/*.dmg
          if-no-files-found: error
          retention-days: 7

  verify:
    if: >-
      github.ref == 'refs/heads/main' &&
      !startsWith(github.event.head_commit.message, 'docs:') &&
      !startsWith(github.event.head_commit.message, 'docs(') &&
      !startsWith(github.event.head_commit.message, 'chore:') &&
      !startsWith(github.event.head_commit.message, 'chore(') &&
      !startsWith(github.event.head_commit.message, 'ci:') &&
      !startsWith(github.event.head_commit.message, 'ci(') &&
      !startsWith(github.event.head_commit.message, 'style:') &&
      !startsWith(github.event.head_commit.message, 'style(') &&
      !startsWith(github.event.head_commit.message, 'test:') &&
      !startsWith(github.event.head_commit.message, 'test(') &&
      !startsWith(github.event.head_commit.message, 'build:') &&
      !startsWith(github.event.head_commit.message, 'build(')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'desktop/package-lock.json'

      - name: Install
        run: cd desktop && npm ci

      - name: Prebuild
        run: cd desktop && npm run prebuild

      - name: Build all
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: |
          cd desktop
          npm run dist:mac || echo "mac failed"
          npm run dist:win || echo "win failed"
          npm run dist:linux || echo "linux failed"

      - name: Verify output
        run: ls -la desktop/dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-mac, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SyncPlay-Windows-Setup
          path: dist-windows
      - uses: actions/download-artifact@v4
        with:
          name: SyncPlay-Mac-dmg
          path: dist-mac
      - uses: actions/download-artifact@v4
        with:
          name: SyncPlay-Linux-AppImage
          path: dist-linux
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-windows/*.exe
            dist-mac/*.dmg
            dist-linux/*.AppImage
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            ## 📥 下载

            **Release: ${{ github.ref_name }}**

            请在下方 **Assets** 区域选择对应平台的安装包：

            | 平台 | 文件类型 | 适用 |
            |---|---|---|
            | 🪟 Windows | `.exe` | Windows 10/11 |
            | 🍎 macOS | `.dmg` | Apple Silicon (M1/M2/M3/M4) |
            | 🐧 Linux | `.AppImage` | 主流 Linux |

            ## ⚠️ macOS 用户必看

            下载 dmg 装上后**双击会弹 "damaged"**——这是 Chrome 下载时自动加的 `com.apple.quarantine` 属性 + macOS Gatekeeper 拦截，**不是 dmg 损坏**。

            **首次打开前**在 Terminal 跑：
            ```bash
            xattr -dr com.apple.quarantine /Applications/SyncPlay.app
            ```
            或者：右键 SyncPlay.app → "打开" → 弹窗"仍要打开"按钮。

            根本解决需要 Apple Developer ID 签名 + notarization（v1.0 阶段处理）。

            ## 📝 更新内容

            详细变更请看下方 GitHub 自动生成的 changelog，或查阅仓库内 [CHANGELOG.md](./blob/main/docs/CHANGELOG.md)。

            ## 📦 安装

            - **Mac**: 双击 dmg → 拖到 /Applications → 跑 xattr 命令 → 双击 .app
            - **Windows**: 双击 exe → 一路下一步（NSIS 安装器）→ 桌面图标启动
            - **Linux**: `chmod +x *.AppImage && ./*.AppImage`

            ## 🙏 反馈

            https://github.com/${{ github.repository }}/issues
